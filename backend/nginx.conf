# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name api.melodrop-app.com;
    return 301 https://$host$request_uri;
}

# HTTPS entry point, forwards requests to the API
server {
    listen 443 ssl;
    server_name api.melodrop-app.com;

    ssl_certificate /etc/letsencrypt/live/api.melodrop-app.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.melodrop-app.com/privkey.pem;

    location / {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}