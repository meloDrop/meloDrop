name: melodrop

services:
  db:
    image: mysql:9.7
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    # No "ports": MySQL is only reachable from the other containers
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -u root --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s
      start_interval: 2s

  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Trust the X-Forwarded-* headers sent by Caddy
      FORWARDED_ALLOW_IPS: "*"
    # No "ports", no code volume, no --reload: the Dockerfile CMD runs
    # "alembic upgrade head" then uvicorn
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    # Only entry point of the server: HTTP and HTTPS
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Certificates created by Certbot on the server
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  mysql_data: